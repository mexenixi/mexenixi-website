<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">利用者が管理するAI受け渡し</title><desc id="desc">AIへ自動送信せず、利用者が共有先と適用を決める</desc><style>
  .box{fill:#fff;stroke:#242424;stroke-width:3}.soft{fill:#f1f1f1;stroke:#555;stroke-width:2.5}
  .external{fill:#fafafa;stroke:#333;stroke-width:4;stroke-dasharray:8 6}
  .line{fill:none;stroke:#5d5d5d;stroke-width:3}.dash{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:8 7}
  .arrow{fill:#5d5d5d}.title{fill:#111;font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .label{fill:#111;font:650 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .small{fill:#333;font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  @media(prefers-color-scheme:dark){.box{fill:#171717;stroke:#ddd}.soft{fill:#292929;stroke:#bbb}.external{fill:#101010;stroke:#ddd}.line,.dash{stroke:#aaa}.arrow{fill:#aaa}.title,.label{fill:#f5f5f5}.small{fill:#d0d0d0}}
</style><text class="title" x="600" y="40" text-anchor="middle"><tspan x="600" dy="0">利用者が管理するAI受け渡し</tspan></text><rect class="box" x="20" y="115" width="210" height="105" rx="18"/><text class="label" x="125.0" y="167.5" text-anchor="middle"><tspan x="125.0" dy="0">対象ページと条件を選ぶ</tspan></text><rect class="box" x="255" y="115" width="210" height="105" rx="18"/><text class="label" x="360.0" y="156.5" text-anchor="middle"><tspan x="360.0" dy="0">AI用PDF・TXTを</tspan><tspan x="360.0" dy="23">端末内で作る</tspan></text><rect class="external" x="490" y="115" width="210" height="105" rx="18"/><text class="label" x="595.0" y="167.5" text-anchor="middle"><tspan x="595.0" dy="0">利用者が共有先を選ぶ</tspan></text><rect class="box" x="725" y="115" width="210" height="105" rx="18"/><text class="label" x="830.0" y="167.5" text-anchor="middle"><tspan x="830.0" dy="0">返却結果をNarabiで検証</tspan></text><rect class="box" x="960" y="115" width="210" height="105" rx="18"/><text class="label" x="1065.0" y="167.5" text-anchor="middle"><tspan x="1065.0" dy="0">確認後に順序を適用</tspan></text><path class="line" d="M230 167 L255 167"/><path class="arrow" d="M242 159 L255 167 L242 175 Z"/><path class="dash" d="M465 167 L490 167"/><path class="arrow" d="M477 159 L490 167 L477 175 Z"/><path class="dash" d="M700 167 L725 167"/><path class="arrow" d="M712 159 L725 167 L712 175 Z"/><path class="line" d="M935 167 L960 167"/><path class="arrow" d="M947 159 L960 167 L947 175 Z"/><rect class="soft" x="300" y="310" width="600" height="82" rx="18"/><text class="label" x="600.0" y="351.0" text-anchor="middle"><tspan x="600.0" dy="0">Narabiは外部AIへ直接接続しない</tspan></text></svg>