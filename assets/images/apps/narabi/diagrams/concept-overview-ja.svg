<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Narabiの全体構造</title><desc id="desc">異なる形式の資料を共通ページとして整理し、必要な形式へ出力する</desc><style>
  .box{fill:#fff;stroke:#242424;stroke-width:3}.soft{fill:#f1f1f1;stroke:#555;stroke-width:2.5}
  .external{fill:#fafafa;stroke:#333;stroke-width:4;stroke-dasharray:8 6}
  .line{fill:none;stroke:#5d5d5d;stroke-width:3}.dash{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:8 7}
  .arrow{fill:#5d5d5d}.title{fill:#111;font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .label{fill:#111;font:650 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .small{fill:#333;font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  @media(prefers-color-scheme:dark){.box{fill:#171717;stroke:#ddd}.soft{fill:#292929;stroke:#bbb}.external{fill:#101010;stroke:#ddd}.line,.dash{stroke:#aaa}.arrow{fill:#aaa}.title,.label{fill:#f5f5f5}.small{fill:#d0d0d0}}
</style><text class="title" x="600" y="42" text-anchor="middle"><tspan x="600" dy="0">Narabiの全体構造</tspan></text><rect class="box" x="45" y="110" width="240" height="115" rx="18"/><text class="label" x="165.0" y="156.5" text-anchor="middle"><tspan x="165.0" dy="0">写真・PDF・文書</tspan><tspan x="165.0" dy="23">異なる形式の資料</tspan></text><rect class="box" x="335" y="110" width="240" height="115" rx="18"/><text class="label" x="455.0" y="156.5" text-anchor="middle"><tspan x="455.0" dy="0">共通ページ</tspan><tspan x="455.0" dy="23">形式の違いを越えて扱う</tspan></text><rect class="box" x="625" y="110" width="240" height="115" rx="18"/><text class="label" x="745.0" y="156.5" text-anchor="middle"><tspan x="745.0" dy="0">ページワークスペース</tspan><tspan x="745.0" dy="23">作業途中も端末内に保持</tspan></text><rect class="box" x="915" y="110" width="240" height="115" rx="18"/><text class="label" x="1035.0" y="156.5" text-anchor="middle"><tspan x="1035.0" dy="0">PDF・画像・写真</tspan><tspan x="1035.0" dy="23">必要な形で保存・共有</tspan></text><path class="line" d="M285 168 L325 168"/><path class="arrow" d="M312 160 L325 168 L312 176 Z"/><path class="line" d="M575 168 L615 168"/><path class="arrow" d="M602 160 L615 168 L602 176 Z"/><path class="line" d="M865 168 L905 168"/><path class="arrow" d="M892 160 L905 168 L892 176 Z"/><rect class="external" x="395" y="305" width="410" height="95" rx="18"/><text class="label" x="600.0" y="341.5" text-anchor="middle"><tspan x="600.0" dy="0">任意のAI受け渡し</tspan><tspan x="600.0" dy="23">共有先と適用を利用者が決める</tspan></text><path class="dash" d="M745 225 L745 305"/><path class="arrow" d="M732 297 L745 305 L732 313 Z"/></svg>