<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">取込みから出力まで</title><desc id="desc">写真、PDF、文書をページ化し、成功したページを保持して複数形式へ出力する</desc><style>
  .box{fill:#fff;stroke:#242424;stroke-width:3}.soft{fill:#f1f1f1;stroke:#555;stroke-width:2.5}
  .external{fill:#fafafa;stroke:#333;stroke-width:4;stroke-dasharray:8 6}
  .line{fill:none;stroke:#5d5d5d;stroke-width:3}.dash{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:8 7}
  .arrow{fill:#5d5d5d}.title{fill:#111;font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .label{fill:#111;font:650 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .small{fill:#333;font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  @media(prefers-color-scheme:dark){.box{fill:#171717;stroke:#ddd}.soft{fill:#292929;stroke:#bbb}.external{fill:#101010;stroke:#ddd}.line,.dash{stroke:#aaa}.arrow{fill:#aaa}.title,.label{fill:#f5f5f5}.small{fill:#d0d0d0}}
</style><text class="title" x="600" y="40" text-anchor="middle"><tspan x="600" dy="0">取込みから出力まで</tspan></text><rect class="box" x="30" y="120" width="200" height="110" rx="18"/><text class="label" x="130.0" y="164.0" text-anchor="middle"><tspan x="130.0" dy="0">写真・PDF・文書</tspan><tspan x="130.0" dy="23">スキャン・表データ</tspan></text><rect class="box" x="265" y="120" width="200" height="110" rx="18"/><text class="label" x="365.0" y="164.0" text-anchor="middle"><tspan x="365.0" dy="0">端末内でページ化</tspan><tspan x="365.0" dy="23">安全確認と進捗表示</tspan></text><rect class="box" x="500" y="120" width="200" height="110" rx="18"/><text class="label" x="600.0" y="164.0" text-anchor="middle"><tspan x="600.0" dy="0">結果を集計</tspan><tspan x="600.0" dy="23">成功ページを保持</tspan></text><rect class="box" x="735" y="120" width="200" height="110" rx="18"/><text class="label" x="835.0" y="164.0" text-anchor="middle"><tspan x="835.0" dy="0">編集欄・素材欄</tspan><tspan x="835.0" dy="23">並べ替え・編集</tspan></text><rect class="box" x="970" y="120" width="200" height="110" rx="18"/><text class="label" x="1070.0" y="164.0" text-anchor="middle"><tspan x="1070.0" dy="0">PDF・JPEG・PNG</tspan><tspan x="1070.0" dy="23">写真・共有・印刷</tspan></text><path class="line" d="M230 175 L265 175"/><path class="arrow" d="M252 167 L265 175 L252 183 Z"/><path class="line" d="M465 175 L500 175"/><path class="arrow" d="M487 167 L500 175 L487 183 Z"/><path class="line" d="M700 175 L735 175"/><path class="arrow" d="M722 167 L735 175 L722 183 Z"/><path class="line" d="M935 175 L970 175"/><path class="arrow" d="M957 167 L970 175 L957 183 Z"/><rect class="soft" x="470" y="310" width="260" height="90" rx="18"/><text class="label" x="600.0" y="344.0" text-anchor="middle"><tspan x="600.0" dy="0">一部を読めない場合</tspan><tspan x="600.0" dy="23">成功ページを残して件数を表示</tspan></text><path class="dash" d="M600 230 L600 310"/><path class="arrow" d="M587 302 L600 310 L587 318 Z"/></svg>