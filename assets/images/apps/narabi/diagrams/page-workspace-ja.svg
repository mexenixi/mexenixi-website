<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">ページワークスペース</title><desc id="desc">編集欄、素材欄、削除済みの間でページを整理する</desc><style>
  .box{fill:#fff;stroke:#242424;stroke-width:3}.soft{fill:#f1f1f1;stroke:#555;stroke-width:2.5}
  .external{fill:#fafafa;stroke:#333;stroke-width:4;stroke-dasharray:8 6}
  .line{fill:none;stroke:#5d5d5d;stroke-width:3}.dash{fill:none;stroke:#777;stroke-width:3;stroke-dasharray:8 7}
  .arrow{fill:#5d5d5d}.title{fill:#111;font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .label{fill:#111;font:650 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .small{fill:#333;font:500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  @media(prefers-color-scheme:dark){.box{fill:#171717;stroke:#ddd}.soft{fill:#292929;stroke:#bbb}.external{fill:#101010;stroke:#ddd}.line,.dash{stroke:#aaa}.arrow{fill:#aaa}.title,.label{fill:#f5f5f5}.small{fill:#d0d0d0}}
</style><text class="title" x="600" y="42" text-anchor="middle"><tspan x="600" dy="0">ページワークスペース</tspan></text><rect class="soft" x="60" y="130" width="270" height="115" rx="18"/><text class="label" x="195.0" y="176.5" text-anchor="middle"><tspan x="195.0" dy="0">素材欄</tspan><tspan x="195.0" dy="23">候補・退避・差し替え</tspan></text><rect class="box" x="465" y="130" width="270" height="115" rx="18"/><text class="label" x="600.0" y="176.5" text-anchor="middle"><tspan x="600.0" dy="0">編集欄</tspan><tspan x="600.0" dy="23">現在の出力順</tspan></text><rect class="soft" x="870" y="130" width="270" height="115" rx="18"/><text class="label" x="1005.0" y="176.5" text-anchor="middle"><tspan x="1005.0" dy="0">削除済み</tspan><tspan x="1005.0" dy="23">復元できるページ</tspan></text><path class="line" d="M330 172 L465 172"/><path class="arrow" d="M452 164 L465 172 L452 180 Z"/><path class="line" d="M465 210 L330 210"/><path class="arrow" d="M317 202 L330 210 L317 218 Z"/><path class="line" d="M735 172 L870 172"/><path class="arrow" d="M857 164 L870 172 L857 180 Z"/><path class="line" d="M870 210 L735 210"/><path class="arrow" d="M722 202 L735 210 L722 218 Z"/><rect class="external" x="465" y="320" width="270" height="90" rx="18"/><text class="label" x="600.0" y="354.0" text-anchor="middle"><tspan x="600.0" dy="0">プレビュー・出力</tspan><tspan x="600.0" dy="23">編集欄の順序を使う</tspan></text><path class="line" d="M600 245 L600 320"/><path class="arrow" d="M587 312 L600 320 L587 328 Z"/></svg>