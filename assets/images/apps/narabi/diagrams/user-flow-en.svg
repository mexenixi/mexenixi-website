<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc"><title id="title">How Narabi works</title><desc id="desc">Four-step overview of the Narabi workflow.</desc><style>rect{fill:#fff;stroke:#222;stroke-width:3}path{fill:none;stroke:#666;stroke-width:3}.arrow{stroke:#222}text{fill:#111;font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}@media(prefers-color-scheme:dark){rect{fill:#171717;stroke:#ddd}path{stroke:#999}.arrow{stroke:#ddd}text{fill:#f4f4f4}}</style><g><rect x="55" y="70" width="210" height="105" rx="18"/><text x="160" y="116" text-anchor="middle"><tspan x="160" dy="0">Import photos, PDFs,</tspan><tspan x="160" dy="25">and documents</tspan></text></g><g><rect x="315" y="70" width="210" height="105" rx="18"/><text x="420" y="116" text-anchor="middle"><tspan x="420" dy="0">Review and organize</tspan><tspan x="420" dy="25">them as pages</tspan></text></g><g><rect x="575" y="70" width="210" height="105" rx="18"/><text x="680" y="116" text-anchor="middle"><tspan x="680" dy="0">Arrange and edit</tspan><tspan x="680" dy="25">the pages</tspan></text></g><g><rect x="835" y="70" width="210" height="105" rx="18"/><text x="940" y="116" text-anchor="middle"><tspan x="940" dy="0">Save or share in</tspan><tspan x="940" dy="25">the format you need</tspan></text></g><path d="M 270 122 L 305 122"/><path class="arrow" d="M 295 114 L 305 122 L 295 130"/><path d="M 530 122 L 565 122"/><path class="arrow" d="M 555 114 L 565 122 L 555 130"/><path d="M 790 122 L 825 122"/><path class="arrow" d="M 815 114 L 825 122 L 815 130"/></svg>